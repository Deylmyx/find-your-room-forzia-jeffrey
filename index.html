<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find your room – Forzia &amp; Jeffrey’s Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Forzia &amp; Jeffrey</h1>
  <p class="when">15-17 March 2027 · The Ruins</p>
  <p class="lead">Type your name to find your room for the wedding weekend.</p>

  <form id="f" role="search" onsubmit="return false">
    <label for="q">Your name</label>
    <div class="row">
      <input id="q" type="search" autocomplete="off" autocapitalize="words" placeholder="First or last name">
      <button type="submit" id="go">Find room</button>
    </div>
  </form>

  <div id="out" aria-live="polite"></div>

  <p class="help">Can’t find your name? Try just your last name, or ask Forzia or Jeffrey and we’ll sort it out.</p>
</main>

<script src="guests.js"></script>
<script src="script.js"></script>
</body>
</html>
